<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspberry Pi Cloud Controller</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(17, 25, 45, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.45);
      --accent-neon: #10b981;
      --accent-neon-glow: rgba(16, 185, 129, 0.45);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: var(--primary-glow);
      filter: blur(140px);
      top: 10%;
      left: 10%;
      z-index: -1;
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(16, 185, 129, 0.18);
      filter: blur(120px);
      bottom: 15%;
      right: 10%;
      z-index: -1;
      border-radius: 50%;
    }
    .container {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      margin-top: 20px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 25px;
    }
    .card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pin-info {
      display: flex;
      flex-direction: column;
    }
    .pin-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }
    .pin-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .controls-wrapper {
      display: flex;
      gap: 20px;
    }
    .control-item {
      text-align: center;
    }
    .control-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #242c3d;
      transition: .3s;
      border-radius: 30px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: #fff;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .speed-section {
      display: none;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 12px;
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .range-slider {
      width: 100%;
      -webkit-appearance: none;
      background: #242c3d;
      height: 6px;
      border-radius: 3px;
      outline: none;
      margin-top: 10px;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 6px var(--primary-glow);
      transition: transform 0.1s;
    }
    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .status-badge {
      font-size: 0.85rem;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent-neon);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-block;
      text-shadow: 0 0 8px var(--accent-neon-glow);
    }
    .footer {
      margin-top: 25px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
    /* Sensor Card Styles */
    .sensor-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02);
    }
    .sensor-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sensor-icon {
      width: 24px;
      height: 24px;
    }
    .sensor-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .sensor-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sensor-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-top: 1px;
    }
    .sensor-divider {
      width: 1px;
      height: 30px;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
      <h1 style="margin: 0; text-align: left;">IoT Control Center</h1>
      <!-- Settings icon opens the local Wi-Fi Config Portal if at home -->
      <a href="http://192.168.0.126/" target="_blank" title="ESP8266 Wifi Settings" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 5px;">
        <svg style="width:24px;height:24px" viewBox="0 0 24 24"><path fill="currentColor" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.34 14.86,5.08L14.48,2.42C14.44,2.18 14.24,2 14,2H10C9.76,2 9.56,2.18 9.52,2.42L9.14,5.08C8.53,5.34 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.04 4.95,18.95L7.44,17.95C7.96,18.34 8.53,18.66 9.14,18.92L9.52,21.58C9.56,21.82 9.76,22 10,22H14C14.24,22 14.44,21.82 14.48,21.58L14.86,18.92C15.47,18.66 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.04 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" /></svg>
      </a>
    </div>
    <div class="subtitle" style="text-align: left; margin-bottom: 20px;">Raspberry Pi Cloud Controller (MQTT Web)</div>

    <!-- Sensor Display Card (DHT11 on Pi 3) -->
    <div class="sensor-card">
      <div class="sensor-item">
        <svg class="sensor-icon" viewBox="0 0 24 24"><path fill="#f43f5e" d="M12 2A3 3 0 0 0 9 5v8.28a5 5 0 1 0 6 0V5a3 3 0 0 0-3-3m0 2a1 1 0 0 1 1 1v3h-2V5a1 1 0 0 1 1-1m0 10a3 3 0 0 1-1 5.67V13h2v6.67A3 3 0 0 1 12 14" /></svg>
        <div class="sensor-info">
          <span class="sensor-label">Pi 3 Temp</span>
          <span id="temp-val" class="sensor-value">-- °C</span>
        </div>
      </div>
      <div class="sensor-divider"></div>
      <div class="sensor-item">
        <svg class="sensor-icon" viewBox="0 0 24 24"><path fill="#0284c7" d="M12 2S4.5 8.5 4.5 13A7.5 7.5 0 0 0 12 20.5A7.5 7.5 0 0 0 19.5 13C19.5 8.5 12 2 12 2M12 4.4C14.7 7.1 17.5 10.9 17.5 13A5.5 5.5 0 0 1 12 18.5A5.5 5.5 0 0 1 6.5 13C6.5 10.9 9.3 7.1 12 4.4M12 9A1 1 0 0 0 11 10A2 2 0 0 0 9 12A1 1 0 1 0 11 12A1 1 0 0 0 12 11A1 1 0 1 0 12 9" /></svg>
        <div class="sensor-info">
          <span class="sensor-label">Pi 3 Humidity</span>
          <span id="hum-val" class="sensor-value">-- %</span>
        </div>
      </div>
    </div>

    <!-- Pin Cards (D0 to D4) -->
    <div id="pin-cards-container">
      <!-- Generated by JS -->
    </div>

    <div class="flex-row" style="justify-content: center; margin-top: 15px;">
      <span class="status-badge" id="status">Connecting Cloud...</span>
    </div>
  </div>
  <div class="footer">Public Cloud Dashboard</div>

  <script>
    let currentBoard = 3;
    const pinsConfig = [
      { name: "D0", desc: "GPIO 17 / Aux Relay" },
      { name: "D1", desc: "GPIO 27 / Water Pump" },
      { name: "D2", desc: "GPIO 22 / Solenoid Valve" },
      { name: "D3", desc: "GPIO 5 / Indicator LED" },
      { name: "D4", desc: "GPIO 6 / Onboard LED" }
    ];

    function generateCards() {
      const container = document.getElementById('pin-cards-container');
      container.innerHTML = '';
      pinsConfig.forEach(pin => {
        const idLower = pin.name.toLowerCase();
        const cardHtml = `
          <div class="card">
            <div class="card-header">
              <div class="pin-info">
                <span class="pin-title">Pin ${pin.name}</span>
                <span class="pin-subtitle">${pin.desc}</span>
              </div>
              <div class="controls-wrapper">
                <div class="control-item">
                  <div class="control-label">Manual</div>
                  <label class="switch">
                    <input type="checkbox" id="${idLower}-switch" onchange="togglePin('${pin.name}', this)">
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="control-item">
                  <div class="control-label">Blink</div>
                  <label class="switch">
                    <input type="checkbox" id="${idLower}-blink" onchange="toggleBlink('${pin.name}', this)">
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>
            <div id="${idLower}-speed-section" class="speed-section">
              <div class="flex-row">
                <span style="font-size: 0.9rem; color: var(--text-muted);">Blink Frequency</span>
                <span id="${idLower}-speed-val" style="font-weight: 600; color: var(--primary);">4 Hz</span>
              </div>
              <input type="range" min="1" max="15" value="4" class="range-slider" id="${idLower}-speed-slider" oninput="changeSpeed('${pin.name}', this.value)">
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }

    // MQTT Over WebSockets Setup
    let mqttClient;
    const mqttHost = "broker.hivemq.com";
    const mqttPort = 8884;
    const mqttPath = "/mqtt";
    const mqttTopic = "duantuoicay/2modun/command";
    const mqttSensorTopic = "duantuoicay/2modun/sensor";

    function connectMQTT() {
      const statusEl = document.getElementById('status');
      statusEl.style.background = 'rgba(245, 158, 11, 0.12)';
      statusEl.style.color = '#f59e0b';
      statusEl.style.borderColor = 'rgba(245, 158, 11, 0.25)';
      statusEl.innerText = 'Connecting Cloud...';

      const clientId = "WebClient86-" + Math.random().toString(16).substr(2, 8);
      mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), mqttPath, clientId);

      mqttClient.onConnectionLost = onConnectionLost;
      mqttClient.onMessageArrived = onMessageArrived;

      const options = {
        useSSL: true,
        onSuccess: onConnectSuccess,
        onFailure: onConnectFailure,
        keepAliveInterval: 30
      };

      mqttClient.connect(options);
    }

    function onConnectSuccess() {
      console.log("Connected to MQTT Broker via WebSockets");
      const statusEl = document.getElementById('status');
      statusEl.style.background = 'rgba(16, 185, 129, 0.12)';
      statusEl.style.color = 'var(--accent-neon)';
      statusEl.style.borderColor = 'rgba(16, 185, 129, 0.25)';
      statusEl.innerText = 'Cloud Connected';
      
      // Subscribe to sensor readings
      mqttClient.subscribe(mqttSensorTopic);
      console.log("Subscribed to " + mqttSensorTopic);
    }

    function onConnectFailure(err) {
      console.log("MQTT Connection Failed:", err);
      const statusEl = document.getElementById('status');
      statusEl.style.background = 'rgba(239, 68, 68, 0.12)';
      statusEl.style.color = '#ef4444';
      statusEl.style.borderColor = 'rgba(239, 68, 68, 0.25)';
      statusEl.innerText = 'Cloud Connect Error';
      setTimeout(connectMQTT, 5000);
    }

    function onConnectionLost(responseObject) {
      if (responseObject.errorCode !== 0) {
        console.log("MQTT Connection Lost:", responseObject.errorMessage);
        const statusEl = document.getElementById('status');
        statusEl.style.background = 'rgba(245, 158, 11, 0.12)';
        statusEl.style.color = '#f59e0b';
        statusEl.style.borderColor = 'rgba(245, 158, 11, 0.25)';
        statusEl.innerText = 'Reconnecting...';
        setTimeout(connectMQTT, 5000);
      }
    }

    function onMessageArrived(message) {
      console.log("Received MQTT message: " + message.destinationName + " -> " + message.payloadString);
      if (message.destinationName === mqttSensorTopic) {
        const parts = message.payloadString.split(',');
        if (parts.length >= 2) {
          document.getElementById('temp-val').innerText = parts[0] + ' °C';
          document.getElementById('hum-val').innerText = parts[1] + ' %';
        }
      }
    }

    function publishCommand(boardId, pin, action, speed) {
      const statusEl = document.getElementById('status');
      if (mqttClient && mqttClient.isConnected()) {
        const payload = `${boardId},${pin},${action},${speed}`;
        const message = new Paho.MQTT.Message(payload);
        message.destinationName = mqttTopic;
        mqttClient.send(message);
        console.log("Published MQTT message: " + payload);

        const oldText = statusEl.innerText;
        const oldBg = statusEl.style.background;
        const oldColor = statusEl.style.color;
        const oldBorder = statusEl.style.borderColor;

        statusEl.style.background = 'rgba(16, 185, 129, 0.12)';
        statusEl.style.color = 'var(--accent-neon)';
        statusEl.style.borderColor = 'rgba(16, 185, 129, 0.25)';
        statusEl.innerText = 'Command Sent!';

        setTimeout(() => {
          if (statusEl.innerText === 'Command Sent!') {
            statusEl.innerText = oldText;
            statusEl.style.background = oldBg;
            statusEl.style.color = oldColor;
            statusEl.style.borderColor = oldBorder;
          }
        }, 800);
      } else {
        console.log("MQTT Client not connected. Retrying connect...");
        connectMQTT();
      }
    }

    // Initialize UI and Connect MQTT
    generateCards();
    connectMQTT();
  </script>
</body>
</html>
